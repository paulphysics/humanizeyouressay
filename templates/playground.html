<!DOCTYPE html>
<html lang="en">
<head>
    <title>AI Playground</title>
    {% include '_head.html' %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/playground.css') }}?v={{ now().timestamp() }}">
</head>
<body class="flex flex-col items-center min-h-screen bg-gray-50">

    {% include '_header.html' %}

    <div id="js-alert-container" class="flash-message rounded-lg shadow-md hidden">
        <span id="js-alert-message"></span>
    </div>

    <div class="max-w-7xl mx-auto w-full flex flex-row gap-6 px-4">
        <div id="history-sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between lg:flex mobile-hidden">
            <div class="flex flex-col min-h-0">
                <div class="p-4 border-b border-gray-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-gray-800">Chat History</h2>
                        <button id="clear-history-btn" title="Clear History" class="p-1 text-gray-500 rounded-md hover:bg-red-100 hover:text-red-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                    <div class="relative">
                        <input type="text" id="search-history-input" placeholder="Search history..."
                               class="w-full pl-8 pr-3 py-2 text-sm text-gray-700 bg-gray-100 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <svg class="w-4 h-4 text-gray-400 absolute top-1/2 left-2.5 -translate-y-1/2"
                             xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path>
                        </svg>
                    </div>
                </div>
                <div id="conversation-list" class="flex-grow overflow-y-auto p-2"></div>
                <div id="history-loading-spinner" class="hidden text-center p-4"><div class="spinner"></div></div>
            </div>
            <div class="flex-shrink-0">
                <div id="history-pagination-container" class="p-2 border-t border-gray-200"></div>
                <div class="p-2 border-t border-gray-200">
                    <button id="new-chat-btn" class="w-full flex items-center justify-center gap-x-2 px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
                        </svg>
                        New Chat
                    </button>
                </div>
            </div>
        </div>

        <div class="w-full lg:flex-grow">
            <div id="playground-welcome-header">
                <div class="flex items-center justify-between mb-2">
                    <h1 class="text-3xl lg:text-4xl font-bold text-gray-800 flex-grow text-center flex items-center justify-center gap-x-3">
                        <svg class="w-8 h-8 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.898 20.624l-.259 1.035L16.38 20.624a3.375 3.375 0 00-2.455-2.455l-1.036-.259.259-1.035a3.375 3.375 0 002.456-2.456l.259-1.035 1.035.259a3.375 3.375 0 002.456 2.456l1.035.259-.259 1.035a3.375 3.375 0 00-2.456 2.456z" /></svg>
                        <span>AI Playground</span>
                    </h1>
                    <button id="show-history-btn" class="lg:hidden btn !py-1 !px-2.5 !text-xs">History</button>
                </div>
                <p class="text-center text-gray-500 mb-6">Direct access to the latest AI models.</p>
            </div>

            <div id="playground-container" class="bg-white p-6 rounded-xl shadow-lg flex flex-col h-[70vh]">
                <div id="model-selection-bar" class="mb-4 flex-shrink-0">
                    <div class="w-72">
                        <label for="model-selector" class="block text-sm font-medium text-gray-700 mb-1">Select Model</label>
                        <div id="model-selector" class="relative">
                            <button id="model-selector-btn" type="button" class="relative w-full cursor-default rounded-md bg-white py-2 pl-3 pr-10 text-left text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 sm:text-sm sm:leading-6">
                                <span id="model-selector-label" class="block truncate">Select a Model</span>
                                <span class="pointer-events-none absolute inset-y-0 right-0 ml-3 flex items-center pr-2">
                                    <svg class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 3a.75.75 0 01.53.22l3.5 3.5a.75.75 0 01-1.06 1.06L10 4.81 6.53 8.22a.75.75 0 01-1.06-1.06l3.5-3.5A.75.75 0 0110 3z" clip-rule="evenodd" /></svg>
                                </span>
                            </button>
                            <ul id="model-selector-options" class="absolute z-10 mt-1 max-h-56 w-full overflow-auto rounded-md bg-white py-1 text-base shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none sm:text-sm" role="listbox">
                            </ul>
                        </div>
                    </div>
                </div>
                <div id="chat-log" class="flex-grow overflow-y-auto p-4 space-y-4"></div>
                <div class="mt-4 pt-4 border-t flex-shrink-0">                
                    <div id="attachment-preview-container" class="mb-2 space-y-2"></div>
                    
                    <div id="drop-zone" class="relative border-2 border-dashed border-gray-300 rounded-lg">
                        <div id="drop-zone-text" class="absolute inset-0 flex items-center justify-center text-gray-400 pointer-events-none z-0">
                            Drop files here or click to attach
                        </div>
                        <input type="file" id="file-input" class="hidden" multiple>
                        <textarea id="prompt-input" class="w-full p-4 pr-32 border-none rounded-lg bg-transparent focus:ring-0 relative z-10" placeholder="Type your message here..."></textarea>
                        
                        <button id="internet-search-toggle" class="absolute right-32 top-1/2 -translate-y-1/2 p-2 rounded-full text-gray-500 hover:bg-indigo-100 z-20" title="Toggle Internet Search">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                            </svg>
                        </button>
                        <button id="upload-btn" class="absolute right-20 top-1/2 -translate-y-1/2 p-2 rounded-full text-gray-500 hover:text-indigo-500 hover:bg-gray-100 z-20" title="Upload File">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                        </button>
                        <button id="generate-btn" class="absolute right-2 top-1/2 -translate-y-1/2 btn !py-2 !px-4 z-20">Send</button>
                    </div>
                </div>
            </div>
            <input type="hidden" id="conversation-id-storage" value="">
        </div>
    </div>
    {% include '_modals.html' %}
    {% include '_footer.html' %}
    <script src="{{ url_for('static', filename='js/script.js') }}?v={{ now().timestamp() }}"></script>
</body>
</html>
