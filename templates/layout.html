<!DOCTYPE html>
<html lang="en">
<head>
    {% include '_head.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.2">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 font-sans leading-normal tracking-normal flex flex-col min-h-screen">

    <div class="flex-grow">
        {% include '_header.html' %}
    
        <main class="container mx-auto px-4 py-8">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    {% include '_footer.html' %}
    
    {% include '_modals.html' %}

    <script src="{{ url_for('static', filename='js/script.js') }}?v=1.2"></script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
