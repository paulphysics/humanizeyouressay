<!DOCTYPE html>
<html lang="en">
<head>
    {% include '_head.html' %}
    <!-- ✅ FIX: Add a version number to the CSS link -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.1">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 font-sans leading-normal tracking-normal">

    {% include '_header.html' %}

    <main class="container mx-auto px-4 py-8">
        {% block content %}
        {% endblock %}
    </main>

    {% include '_footer.html' %}
    
    {% include '_modals.html' %}

    <script src="{{ url_for('static', filename='js/script.js') }}?v={{ range(1, 10000) | random }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
