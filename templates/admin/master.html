{% extends 'admin/base.html' %}

{% block head_css %}
  {{ super() }}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
{% endblock %}

{% block head %}
  {{ super() }}
  <style>
    /* --- Custom CSS Overrides for a Modern UI --- */
    body, .nav-link, .btn, h1, h2, h3, h4, p, th, td, a, .form-control, label {
      font-family: 'Inter', sans-serif !important;
    }
    body { 
      background-color: #f8f9fa; 
    }
    
    .container-fluid {
      max-width: 80rem;
      margin-left: auto;
      margin-right: auto;
    }

    /* --- Stylish Admin Tables --- */
    .table {
        border-collapse: separate;
        border-spacing: 0 8px;
        margin-top: -8px;
    }
    .table th, .table td {
        border-top: none !important;
        vertical-align: middle !important;
        padding: 1rem 0.75rem;
    }
    .table thead th {
        border-bottom: 2px solid #e3e6f0;
        font-size: 0.85rem;
        font-weight: 700;
        color: #5a5c69;
        text-transform: uppercase;
        background-color: transparent;
    }
    .table tbody tr {
        background-color: #fff;
        box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.08);
        border-radius: 0.35rem;
        transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }
    .table tbody tr:hover {
        transform: translateY(-3px);
        box-shadow: 0 0.35rem 2rem 0 rgba(58, 59, 69, 0.15);
    }
    .table tbody td:first-child {
        border-top-left-radius: 0.35rem;
        border-bottom-left-radius: 0.35rem;
    }
    .table tbody td:last-child {
        border-top-right-radius: 0.35rem;
        border-bottom-right-radius: 0.35rem;
    }
    
    /* --- Prominent Buttons --- */
    .btn-primary {
      background-color: #4f46e5 !important; 
      border-color: #4f46e5 !important;
      font-weight: 600; 
      border-radius: 8px !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: all 0.2s ease-in-out;
      /* --- THIS IS THE FIX: Changed text color --- */
      color: #ffffff !important; 
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .btn {
        border-radius: 8px !important;
        font-weight: 600;
    }
    
    #content > h1, .h3 {
      font-weight: 700; 
      color: #343a40;
    }

    /* --- Prominent Navbar Links --- */
    .navbar-dark .navbar-nav .nav-link {
        font-weight: 600;
        transition: background-color 0.2s ease-in-out;
        border-radius: 6px;
    }
    .navbar-dark .navbar-nav .nav-link:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
{% endblock %}

{% block page_body %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('admin.index') }}">AI Humanizer Admin</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('user.index_view') }}">Users</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('all-tasks.index_view') }}">All Tasks</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('transaction.index_view') }}">Transactions</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('referralwithdrawal.index_view') }}">Referral Withdrawals</a>
          </li>
        </ul>
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid" id="content">
    {% block body %}{% endblock %}
  </div>
{% endblock %}
