<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    {% include '_head.html' %}
    <script>
        window.firebaseConfig = {{ firebase_config | tojson }};
    </script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md text-left mb-4">
        <a href="{{ url_for('main.index') }}" class="text-indigo-600 hover:underline font-semibold">← Back to Home</a>
    </div>

    <div class="container card p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">🍸Create Your Account</h1>

        <p id="success-message" class="text-green-600 bg-green-100 p-3 rounded-lg text-center mb-4" style="display: none;"></p>

        <div class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="first-name-input" class="block text-lg font-medium text-gray-700">First Name:</label>
                    <input type="text" id="first-name-input" class="w-full p-3 border border-gray-300 rounded-lg" required>
                </div>
                <div>
                    <label for="last-name-input" class="block text-lg font-medium text-gray-700">Last Name:</label>
                    <input type="text" id="last-name-input" class="w-full p-3 border border-gray-300 rounded-lg" required>
                </div>
            </div>
            <p id="name-error-message" class="text-red-500 text-sm -mt-2"></p>

            <div>
                <label for="email-input" class="block text-lg font-medium text-gray-700">Email:</label>
                <input type="email" id="email-input" class="w-full p-3 border border-gray-300 rounded-lg">
                <p id="email-error-message" class="text-red-500 text-sm mt-1"></p>
            </div>

            <div>
                <label for="password-input" class="block text-lg font-medium text-gray-700">Password:</label>
                <input type="password" id="password-input" class="w-full p-3 border border-gray-300 rounded-lg">
                <p id="password-error-message" class="text-red-500 text-sm mt-1"></p>
            </div>

            <button id="create-account-btn" class="btn w-full bg-gray-400 cursor-not-allowed" disabled>Create Account</button>

            <div class="relative my-4">
              <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
              </div>
              <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-white text-gray-500">Or sign up with</span>
              </div>
            </div>

            <button id="sign-up-with-google-btn" class="btn w-full bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 flex items-center justify-center">
                <svg class="w-5 h-5 mr-3" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                    <path fill="none" d="M0 0h48v48H0z"></path>
                </svg>
                <span>Sign up with Google</span>
            </button>
        </div>
        <p class="text-center mt-4">
            Already have an account? <a href="{{ url_for('auth.login') }}" class="text-indigo-600 hover:underline">Login</a>
        </p>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/login-auth.js') }}"></script>
</body>
</html>
