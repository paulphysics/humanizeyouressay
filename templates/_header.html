<header class="w-full max-w-7xl mx-auto flex justify-between items-center px-2 mb-4 py-4">

    <div class="flex-shrink-0">
        <a href="{{ url_for('main.index') }}" class="bg-gradient-to-r from-sky-500 via-purple-800 to-red-600 bg-clip-text text-4xl font-bold text-transparent" {% if user %}title="{{ user.name }} ({{ user.email }})"{% endif %}>
            {% if username %}Hi, {{ username.split(' ')[0] | truncate(12, True) }}{% else %}Hello there!{% endif %}
        </a>
    </div>

    <button id="menu-btn" class="lg:hidden focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
    </button>

    <nav id="mobile-menu" class="hidden lg:flex items-center space-x-2 flex-nowrap">
        {% if username %}
            {# --- Logged-in user menu items (unchanged) --- #}
            {% if not is_admin %}
                <div class="flex items-center space-x-2">
                    <span id="wallet-toggle" class="flex items-center text-gray-600 whitespace-nowrap text-sm cursor-pointer balance-hidden" title="Click to hide/show balance">
                        <svg id="wallet-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                        </svg>
                        <strong id="wallet-balance-amount" class="text-gray-500" data-balance="{{ "%.2f"|format(wallet_balance) }}">KSh ***</strong>
                    </span>
                    <button id="topUpBtn" class="text-white font-semibold rounded-lg transition duration-300 text-xs py-1.5 px-2.5 bg-green-400 hover:bg-green-500">Top Up</button>
                </div>
                <div class="border-l border-gray-300 h-6"></div>
            {% endif %}

            <div class="flex items-center space-x-2">
                <a href="{{ url_for('main.index') }}" class="p-2 rounded-full text-gray-500 hover:bg-indigo-100 hover:text-indigo-600 bg-gray-100" title="Playground: ChatGPT-5, 4o, 4.1, and more...">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.898 20.624l-.259 1.035L16.38 20.624a3.375 3.375 0 00-2.455-2.455l-1.036-.259.259-1.035a3.375 3.375 0 002.456-2.456l.259-1.035 1.035.259a3.375 3.375 0 002.456 2.456l1.035.259-.259 1.035a3.375 3.375 0 00-2.456 2.456z" />
                    </svg>
                </a>
                <a href="{{ url_for('main.transaction_history') }}" class="p-2 rounded-full text-gray-500 hover:bg-indigo-100 hover:text-indigo-600 bg-gray-100" title="History">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </a>
                <a href="{{ url_for('main.instructions') }}" class="p-2 rounded-full text-gray-500 hover:bg-indigo-100 hover:text-indigo-600 bg-gray-100" title="Guide">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                </a>
                <a href="{{ url_for('main.referrals_page') }}" class="p-2 rounded-full text-gray-500 hover:bg-indigo-100 hover:text-indigo-600 bg-gray-100" title="My Referrals">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </a>
                <a href="{{ url_for('main.humanizer_page') }}" class="p-2 rounded-full text-gray-500 hover:bg-indigo-100 hover:text-indigo-600 bg-gray-100" title="Humanizer">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                  </svg>
                </a>
                {% if is_admin %}
                <a href="{{ url_for('admin_dashboard.dashboard') }}" class="text-gray-600 hover:text-indigo-600 font-semibold py-2 px-3 rounded-lg">Admin</a>
                {% endif %}
                <a href="{{ url_for('auth.logout') }}" class="p-2 rounded-full hover:bg-red-100 bg-gray-100" title="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </a>
            </div>
        {% else %}
            <a href="{{ url_for('auth.auth_page') }}" class="bg-indigo-600 text-white font-semibold px-5 py-2 rounded-lg hover:bg-indigo-700 transition duration-300">Sign Up/In</a>
        {% endif %}
    </nav>
</header>
