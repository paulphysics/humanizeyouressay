<!-- 💸 PAYMENT CONFIRMATION MODAL (Humanize Payment via M-Pesa) -->
<div id="paymentModal" class="modal hidden">
  <div class="modal-content">
    <span id="closeMpesaModalBtn" class="close-button">×</span>
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
      <img src="{{ url_for('static', filename='images/mpesa_logo.png') }}" alt="M-Pesa Logo" class="mx-auto h-20 mb-4">
      Confirm Payment
    </h2>
    <p class="text-center text-gray-600 mb-4">
      You are about to humanize <span id="modal_word_count_display">0</span> words
      for KSh <span id="modal_estimated_cost_display">0</span>.
    </p>

    <div class="space-y-4">
      <div>
        <label for="phone_number_modal" class="block text-lg font-medium text-gray-700 mb-2">
          Phone Number (M-Pesa):
        </label>
        <input type="tel" id="phone_number_modal"
               class="w-full p-4 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 shadow-sm"
               placeholder="e.g., 0712345678" required>
      </div>
    </div>

    <button type="button" id="submitPaymentBtn"
            class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg mt-6 transition duration-300 ease-in-out">
      Submit Payment
    </button>
  </div>
</div>

<!-- 💰 TOP UP MODAL (M-Pesa Only) -->
<div id="topUpModal" class="modal hidden">
  <div class="modal-content">
    <span id="closeTopUpModalBtn" class="close-button">×</span>
    <h2 class="text-xl font-bold text-center text-gray-800 mb-4">
      <img src="{{ url_for('static', filename='images/mpesa_logo.png') }}"
           alt="M-Pesa Logo" class="mx-auto h-20 mb-4">
      Top Up Your Wallet
    </h2>

    <p class="text-center text-gray-600 mb-3 text-sm">
      You are about to top up your wallet via M-Pesa.
    </p>

    <div class="space-y-3">
      <div>
        <label for="top_up_amount" class="block text-base font-medium text-gray-700 mb-1">
          Amount:
        </label>
        <input type="number" id="top_up_amount"
               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 shadow-sm text-sm"
               placeholder="e.g., 500" required>
      </div>

      <div>
        <label for="phone_number_top_up" class="block text-base font-medium text-gray-700 mb-1">
          Phone Number (M-Pesa):
        </label>
        <input type="tel" id="phone_number_top_up"
               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 shadow-sm text-sm"
               placeholder="e.g., 0712345678" required>
      </div>
    </div>

    <button type="button" id="submitTopUpBtn"
            class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg mt-4 text-sm transition duration-300 ease-in-out">
      Top Up with M-Pesa
    </button>
  </div>
</div>

<!-- 🧭 PAYMENT METHOD SELECTION MODAL -->
<div id="paymentMethodModal" class="modal hidden">
  <div class="modal-content">
    <span id="closePaymentMethodModalBtn" class="close-button">×</span>
    <h2 class="text-xl font-bold text-center text-gray-800 mb-4">Choose Payment Method</h2>
    <p class="text-center text-gray-600 mb-6 text-sm">
      Select how you’d like to top up your wallet.
    </p>

    <div class="space-y-4">
      <!-- ✅ M-Pesa Button (white background, green border) -->
      <button id="chooseMpesaBtn"
              class="w-full bg-white border border-green-500 hover:bg-green-50 text-green-600 font-bold 
                     py-3 px-6 rounded-lg text-sm transition duration-300 ease-in-out flex items-center justify-center shadow-sm">
        <img src="{{ url_for('static', filename='images/mpesa_logo.png') }}" 
             alt="M-Pesa" class="h-5 inline-block mr-2">
        Pay with M-Pesa
      </button>

      <!-- ✅ PayPal Button (hover darkens for consistency) -->
      <button id="choosePaypalBtn"
              class="w-full bg-yellow-400 hover:bg-yellow-500 hover:brightness-95 text-gray-900 font-semibold 
                     py-3 px-6 rounded-lg text-sm transition duration-300 ease-in-out flex items-center justify-center shadow-sm">
        <img src="{{ url_for('static', filename='images/paypal_logo.png') }}" 
             alt="PayPal" class="h-5 inline-block mr-2">
        Pay with PayPal
      </button>
    </div>
  </div>
</div>

<!-- ⚙️ CONTROLLER SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const paymentSelector = document.getElementById("paymentMethodModal");
  const topUpModal = document.getElementById("topUpModal");
  const closeSelector = document.getElementById("closePaymentMethodModalBtn");
  const mpesaBtn = document.getElementById("chooseMpesaBtn");
  const paypalBtn = document.getElementById("choosePaypalBtn");

  // 🧩 Prevent M-Pesa modal auto popup
  topUpModal.classList.add("hidden");

  // Manual Top Up click
  window.openPaymentSelector = function() {
    topUpModal.classList.add("hidden");  // close any active M-Pesa modal
    paymentSelector.classList.remove("hidden");
  };

  // Close selector
  closeSelector.addEventListener("click", () => paymentSelector.classList.add("hidden"));

  // ✅ M-Pesa option
  mpesaBtn.addEventListener("click", () => {
    paymentSelector.classList.add("hidden");
    topUpModal.classList.remove("hidden");
  });

  // ✅ PayPal option
  paypalBtn.addEventListener("click", () => {
    paymentSelector.classList.add("hidden");
    const amount = prompt("Enter the amount in USD to top up:");
    if (amount && parseFloat(amount) > 0) {
      window.location.href = `/paypal/create_payment?amount=${amount}`;
    } else {
      alert("Please enter a valid amount.");
    }
  });

  // 🧠 Intercept auto top-up trigger (insufficient funds)
  const originalShowTopUp = window.showTopUpModal;
  window.showTopUpModal = function() {
    topUpModal.classList.add("hidden");
    paymentSelector.classList.remove("hidden");
  };
});
</script>
