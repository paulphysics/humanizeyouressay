<div class="flex flex-col lg:flex-row gap-6">

    <div class="w-full lg:w-1/2 flex flex-col">
        <form id="humanizeForm" class="space-y-4 flex flex-col">
            <div class="relative border border-gray-300 rounded-lg shadow-sm flex flex-col h-64">
                <textarea id="input_text" name="input_text" class="block w-full border-0 p-4 pb-16 text-gray-900 placeholder:text-gray-300 focus:ring-0 sm:text-sm sm:leading-6 flex-grow"
                          placeholder="Paste your text here..."></textarea>
                
                <div id="references_section" class="hidden absolute inset-0 p-4 bg-white">
                    <textarea id="bibtex_input" name="bibtex_input" class="w-full h-full p-4 border border-gray-300 rounded-lg focus:border-indigo-500 shadow-sm sm:text-sm" rows="4" placeholder="Paste references here..."></textarea>
                </div>
                
                <div class="absolute bottom-4 left-4 right-4">
                    <div class="flex items-center justify-center flex-wrap gap-2">
                        <div class="flex items-center gap-x-3">
                            <button type="button" class="popup-trigger cursor-default text-indigo-600" title="Word Count">
                                <span id="input_word_count_display">0</span> words
                            </button>
                            <p class="popup-trigger cursor-default text-green-600" title="Estimated Cost">
                                <span id="estimated_cost_display">KSh 0</span>
                            </p>
                        </div>

                        <div class="popup-control">
                             <button type="button" id="modeBtn" class="popup-trigger placeholder" title="Tool Mode">
                                <span id="mode_display">Mode</span>
                            </button>
                            <div id="modePopup" class="popup-menu hidden">
                                <input type="radio" id="mode_standard" name="humanizer_mode" value="standard"><label for="mode_standard">Standard</label>
                                <input type="radio" id="mode_essay" name="humanizer_mode" value="essay"><label for="mode_essay">Essay</label>
                                <input type="radio" id="mode_formatter" name="humanizer_mode" value="document_formatter"><label for="mode_formatter" class="text-red-300">Formatting Only!</label>
                            </div>
                        </div>
                        <div class="popup-control">
                            <button type="button" id="formatBtn" class="popup-trigger placeholder" title="Output Format">
                                <span id="format_display">Format</span>
                            </button>
                            <div id="formatPopup" class="popup-menu hidden">
                                <input type="radio" id="plain_text_output" name="output_format" value="plain_text"><label for="plain_text_output">Plain Text</label>
                                <input type="radio" id="apa7_output" name="output_format" value="apa_7"><label for="apa7_output">APA 7</label>
                                <input type="radio" id="mla9_output" name="output_format" value="mla_9"><label for="mla9_output">MLA 9</label>
                                <input type="radio" id="harvard_output" name="output_format" value="harvard"><label for="harvard_output">Harvard</label>
                            </div>
                        </div>
                        <div class="popup-control">
                            <button type="button" id="dialectBtn" class="popup-trigger placeholder" title="English Dialect">
                                <span id="dialect_display">Dialect</span>
                            </button>
                            <div id="dialectPopup" class="popup-menu hidden">
                                <input type="radio" id="dialect_us" name="english_dialect" value="us"><label for="dialect_us">US</label>
                                <input type="radio" id="dialect_uk" name="english_dialect" value="uk"><label for="dialect_uk">UK</label>
                                <input type="radio" id="dialect_au" name="english_dialect" value="au"><label for="dialect_au">AU</label>
                                <input type="radio" id="dialect_ca" name="english_dialect" value="ca"><label for="dialect_ca">CA</label>
                            </div>
                        </div>
                        <button type="button" id="toggleReferencesBtn" class="popup-trigger" title="Add References">📚</button>
                        <button type="button" id="resetBtn" class="popup-trigger" title="Reset Selections">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 110 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center justify-center pt-2">
                <button type="button" id="openPaymentModalBtn" class="btn disabled:bg-gray-400 disabled:cursor-not-allowed">Humanize</button>
            </div>
        </form>
    </div>

    <div id="humanized_output_section" class="w-full lg:w-1/2 flex flex-col mobile-hidden">
        <div class="relative w-full border border-gray-300 rounded-lg bg-gray-50 flex flex-col h-64">
            <div id="output_placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-center text-gray-400 p-4">
                
                <div class="typing-container text-sm mt-4">
                    <span id="typing-text"></span>
                    <span class="typing-cursor"></span>
                </div>
            </div>

            <div id="humanized_output_display" class="humanized-output-text w-full p-4 break-words whitespace-pre-wrap flex-grow overflow-y-auto"></div>
        </div>
        
        <div class="flex justify-between items-center pt-2">
            <p class="text-sm text-gray-500">Word count: <span id="output_word_count_value">0</span></p>
            <button id="copyButton" class="btn w-auto px-4 bg-green-600 hover:bg-green-700" title="Copy Humanized Text">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
            </button>
        </div>
    </div>

</div>
