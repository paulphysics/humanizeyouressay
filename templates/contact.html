{% extends "layout.html" %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto card p-8 w-full">
    <h1 class="text-3xl font-bold text-center text-gray-800 mb-6 flex items-center justify-center gap-x-3">
        <span>Contact Us</span>
    </h1>
    <p class="text-center text-gray-600 mb-8">
        Have a question or want a website like this? Send us a message!
    </p>
    
    <form id="contactForm" class="space-y-6">
        <div>
            <label for="message" class="block text-lg font-medium text-gray-700 mb-2">Your Message:</label>
            <textarea id="message" name="message" rows="6" class="w-full p-4 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 shadow-sm" required placeholder="Let us know how we can help..."></textarea>
        </div>
        <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center transition duration-300 ease-in-out">
            <svg class="w-6 h-6 mr-2 inline-block" fill="currentColor" viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.61 15.35 3.48 16.85L2.06 22L7.33 20.55C8.77 21.37 10.37 21.82 12.04 21.82C17.5 21.82 21.95 17.37 21.95 11.91C21.95 9.27 20.91 6.8 19.05 4.94C17.19 3.08 14.72 2 12.04 2M12.04 3.67C16.56 3.67 20.28 7.39 20.28 11.91C20.28 16.43 16.56 20.15 12.04 20.15C10.48 20.15 9 19.72 7.75 18.96L7.33 18.72L4.42 19.63L5.35 16.81L5.1 16.39C4.24 14.99 3.8 13.47 3.8 11.91C3.8 7.39 7.52 3.67 12.04 3.67M9.13 8.16C8.89 7.6 8.54 7.58 8.32 7.57C8.13 7.57 7.91 7.56 7.7 7.56C7.48 7.56 7.18 7.65 6.91 7.92C6.64 8.19 6 8.78 6 9.92C6 11.06 6.92 12.12 7.07 12.31C7.22 12.5 9.13 15.41 12 16.83C14.87 18.25 15.28 18.06 15.69 18.01C16.1 17.96 17.15 17.38 17.39 16.77C17.63 16.16 17.63 15.65 17.56 15.53C17.48 15.41 17.29 15.34 17.02 15.2C16.75 15.06 15.6 14.5 15.38 14.41C15.16 14.32 15.01 14.28 14.86 14.55C14.71 14.82 14.21 15.33 14.07 15.48C13.92 15.65 13.78 15.68 13.51 15.53C13.24 15.39 12.1 15.01 10.74 13.77C9.75 12.89 9.1 11.83 8.94 11.56C8.78 11.29 8.94 11.13 9.08 11C9.2 10.88 9.35 10.68 9.5 10.5C9.65 10.32 9.71 10.22 9.8 10.05C9.89 9.88 9.84 9.73 9.77 9.61C9.7 9.49 9.22 8.26 9.13 8.16Z"></path></svg>
            Send via WhatsApp
        </button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const contactForm = document.getElementById('contactForm');
    if (contactForm) {
        contactForm.addEventListener('submit', function(event) {
            event.preventDefault();
            
            const message = document.getElementById('message').value;
            const encodedMessage = encodeURIComponent(message);
            const whatsappNumber = "{{ whatsapp_number }}"; // This is rendered by Flask
            
            if (whatsappNumber) {
                const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
                window.open(whatsappUrl, '_blank');
            } else {
                console.error("WhatsApp number is not defined.");
                // You might want to show an alert to the user here
            }
        });
    }
});
</script>
{% endblock %}
